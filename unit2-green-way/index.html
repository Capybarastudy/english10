<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Green Way – Unit 2, Topic 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: sticky header with a plant that grows with progress; an animated eco-city scene above the route map; one station open at a time.
   Light green theme: mint background, white cards, deep-green header. All motion respects prefers-reduced-motion. */
:root{--bg:#E4F6E6;--bg2:#0B3D2E;--ink:#12362A;--muted:#47705D;--line:#BFDCC8;--surface:#FFFFFF;--leaf:#2E9E5B;--leaf-d:#1B7F4B;--lime:#A8E05F;--sun:#FFD84D;--coral:#F0745A;--ok:#24965E;--ok-soft:#D4F0E0;--bad:#C8412F;--bad-soft:#FBDCD7;--key:#8A5A00;--key-soft:#FFF3C4;
--f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;--f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%;background:linear-gradient(180deg,#CFF0D8 0,#E9F8E4 38%,#F6FBEA 100%) fixed var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf-d);outline-offset:2px}
.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.leaves i{position:absolute;top:-30px;width:18px;height:18px;border-radius:0 80% 0 80%;background:var(--leaf);opacity:.22;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(40px,55vh) rotate(180deg)}100%{transform:translate(-20px,110vh) rotate(360deg)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);color:#fff;border-bottom:4px solid var(--lime)}
.top-in{max-width:900px;margin:0 auto;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.brand{font-family:var(--f-display);font-size:22px;line-height:1;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A9D8BC;margin-top:3px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:#CDEBD7}
.bar{width:110px;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--sun));transition:width .5s}
.hplant{width:38px;height:50px;flex:none}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding-block:20px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--leaf-d);font-weight:700}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7vw,62px);line-height:1;margin:6px 0 12px;text-wrap:balance;color:var(--bg2)}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.5vw,38px);line-height:1.05;margin:4px 0 10px;text-wrap:balance;color:var(--bg2)}
h3{font-size:18px;margin:20px 0 8px;color:var(--bg2)}
p{margin:0 0 12px;max-width:68ch}
.lead{color:var(--muted);font-size:18px}
.scene{display:block;width:100%;height:auto;border-radius:18px;margin:0 0 18px;box-shadow:0 8px 24px rgba(11,61,46,.18)}
.scene.mini{margin:10px 0 14px;border-radius:14px;box-shadow:none}
.goal{display:inline-block;background:var(--key-soft);color:var(--ink);border-left:6px solid var(--sun);border-radius:6px;padding:10px 14px;margin:6px 0 20px;font-weight:700}
.route{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:14px}
.route::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:6px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--leaf) 0 14px,transparent 14px 24px);background-size:6px 24px;opacity:.6;animation:flow 1.6s linear infinite}
@keyframes flow{to{background-position:0 24px}}
.stop{position:relative;display:flex;gap:16px;align-items:stretch}
.num{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;background:#fff;color:var(--leaf-d);border:4px solid var(--leaf);z-index:1;align-self:center;overflow:hidden}
.num svg{width:34px;height:44px;margin-top:6px}
.stop.done .num{background:var(--ok-soft)}
.stop.final .num{border-color:var(--sun);background:var(--sun);color:var(--bg2)}
.card{flex:1;text-align:left;cursor:pointer;background:var(--surface);color:var(--ink);border:3px solid transparent;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(11,61,46,.1)}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--leaf);box-shadow:0 8px 18px rgba(11,61,46,.16);outline:none}
.card .t{font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--bg2)}
.card .s{font-size:15px;color:var(--muted)}
.card .m{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--key);font-weight:700;margin-top:4px}
.stop.done .card .m{color:var(--ok)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 24px}
.how div{background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;border:2px solid var(--line)}
.how b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf-d)}
.back{background:none;border:0;color:var(--leaf-d);cursor:pointer;padding:6px 0;font-size:15px;text-decoration:underline}
.paper{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;margin:12px 0;border:2px solid var(--line)}
.tip{display:flex;gap:10px;background:var(--key-soft);color:var(--ink);border-left:6px solid var(--sun);border-radius:6px;padding:10px 14px;margin:10px 0;font-size:16px}
.item{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.item.ok{border-color:var(--ok);background:var(--ok-soft)}.item.bad{border-color:var(--bad);background:var(--bad-soft)}
.item .q{margin:0 0 8px}.item .q b{color:var(--leaf-d);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:8px 14px;border-radius:8px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:700;transition:transform .1s}
.opt:active{transform:scale(.96)}
.opt[aria-pressed=true]{background:var(--leaf-d);border-color:var(--leaf-d);color:#fff}
.fb{font-size:15px;margin:8px 0 0;color:var(--ink)}
.fb.bad{color:var(--bad);font-weight:700}.fb.good{color:var(--ok);font-weight:700}
.btn{min-height:46px;padding:10px 20px;border-radius:999px;border:2px solid var(--leaf-d);background:var(--leaf-d);color:#fff;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(27,127,75,.35)}
.btn.ghost{background:transparent;color:var(--leaf-d)}
.btn.light{background:#fff;color:var(--ink);border-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.result{font-weight:700;padding:8px 0;display:flex;align-items:center;gap:10px;color:var(--key)}
.result.win{color:var(--ok)}
.result .pl{width:44px;height:58px;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--leaf);border-radius:10px;margin:10px 0;background:rgba(255,255,255,.55)}
.chip{min-height:44px;padding:8px 12px;border-radius:8px;background:#fff;color:var(--ink);border:2px solid var(--line);cursor:pointer;text-align:left;font-size:16px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.chip.sel{border-color:var(--leaf-d);box-shadow:0 0 0 3px var(--lime)}.chip.ok{background:var(--ok-soft);border-color:var(--ok)}.chip.bad{background:var(--bad-soft);border-color:var(--bad)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bucket{background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:10px;min-height:140px;cursor:pointer}
.bucket h4{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:22px}
.bucket.pro h4{color:var(--ok)}.bucket.con h4{color:var(--bad)}.bucket.str h4{color:#0F7A82}
.bucket.armed{border-color:var(--leaf-d);background:#F1FBE3;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(168,224,95,.6)}}
.bucket .chips{display:flex;flex-direction:column;gap:6px}
select,input[type=text],textarea{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
input.gap{width:min(100%,230px);margin:0 4px;border-style:solid;border-width:0 0 3px;border-radius:0;background:#EEF8F0}
input.gap.ok,select.ok{border-color:var(--ok);background:var(--ok-soft)}input.gap.bad,select.bad{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:150px;line-height:1.6}
.dlg p{max-width:none;line-height:2.1}
.ord{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.ord .chip{flex:1;cursor:default}.ord .ar{display:flex;flex-direction:column;gap:4px}.ord .ar button{flex:1;min-width:44px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;font-weight:700}
.cards{background:linear-gradient(135deg,#fff,#EFFADF);color:var(--ink);border-radius:14px;padding:20px;text-align:center;font-size:22px;font-weight:700;min-height:120px;display:grid;place-items:center;border:4px solid var(--leaf)}
.cards.flip{animation:flip .4s}
@keyframes flip{from{transform:rotateX(80deg);opacity:.3}to{transform:none;opacity:1}}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;color:var(--ink)}
.checks input{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.wc{font-size:14px;color:var(--muted)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pair div{background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:15px;border:2px solid var(--line)}
.pair b{color:var(--leaf-d)}
/* scoring */
.sp{background:rgba(255,216,77,.16);border:1px solid #FFD84D;color:#FFE98A;border-radius:999px;padding:2px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.tm{float:right;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0;text-transform:none;color:var(--leaf-d);background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 12px;font-size:15px}
.board{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--sun);border-radius:16px;padding:14px 18px;margin:0 0 22px;box-shadow:0 4px 14px rgba(11,61,46,.12)}
.board .rk{font-size:56px;line-height:1;flex:none}
.board .bd{flex:1;min-width:0}
.board .rn{font-family:var(--f-display);font-size:26px;color:var(--bg2);line-height:1.1;margin-bottom:6px}
.board .nb{height:12px;border-radius:7px;background:var(--line);overflow:hidden}
.board .nb i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--sun));transition:width .6s}
.board .pts{font-size:14px;color:var(--muted);margin-top:5px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:#EEF3EF;color:#8AA196;border:2px dashed #C9D8CE;filter:grayscale(1);opacity:.75}
.badge.on{background:var(--key-soft);color:var(--key);border:2px solid var(--sun);filter:none;opacity:1}
.stars{color:#E8A400;letter-spacing:1px}
details.rules{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px;margin:0 0 22px;font-size:15px}
details.rules summary{cursor:pointer;font-weight:700;color:var(--leaf-d)}
details.rules ul{margin:8px 0 2px;padding-left:20px}
.ord .chip.sel{outline:4px solid var(--sun);outline-offset:1px;background:var(--key-soft)}
.ord .chip{cursor:pointer}
@media(max-width:560px){.bar{display:none}.board{flex-direction:column;align-items:flex-start}}
.garden{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 8px 24px rgba(11,61,46,.18);font-family:var(--f-body)}
.spot{cursor:pointer;outline:none}
.spot .art{transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}
.spot:hover .art,.spot:focus-visible .art{transform:scale(1.07)}
.spot:focus-visible .pill{stroke:#0B3D2E;stroke-width:5}
.spot:hover .pill{fill:#FFF3C4}
.cap{min-height:3em;margin:10px 2px 0;font-size:15px;color:var(--muted)}
/* scene motion */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.sway.s2{animation-duration:5.2s;animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:growup .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes growup{from{transform:scale(.2)}to{transform:scale(1)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.sun{animation:sunp 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunp{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.leaves{display:none}}
@media print{body{background:#fff}.top,.back,.btn,.leaves,.scene{display:none}}
</style>

<body>
<div class="leaves" aria-hidden="true"></div>
<header class="top"><div class="top-in"><div class="brand">The Green Way<small>Unit 2 · Topic 1 · pp. 36–38</small></div><div class="prog"><span id="hp"></span><span id="pt">0 / 7</span><span class="sp" id="sp">0 pts</span><div class="bar"><i id="pb" style="width:0%"></i></div></div></div></header>
<main id="app"></main>
<script>
"use strict";
const KEY="cs-english10-u2t1-v1";
let S={done:{},v:{},stat:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){}
S.time=S.time||{};S.pts=S.pts||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const V=(k,d)=>S.v[k]===undefined?d:S.v[k];

const norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/won't/g,"will not").replace(/'ll/g," will").replace(/'m/g," am").replace(/'re/g," are").replace(/'s going/g," is going").replace(/\bi'd\b/g,"i would").replace(/[.!?]/g,"").replace(/\s+/g," ").trim();

/* ---------- data ---------- */
const READ=[
["The Vía Verde scheme grows plants up the concrete columns of motorways.","T","Lines 13–17: the plants grow up the sides of the motorway columns."],
["The plants grow in material that is made from recycled plastic bottles.","T","Lines 27–29."],
["The project was cheap to build.","F","Lines 31–33: the costs are ‘sky-high’ and hard to justify."],
["The plants can turn a lot of carbon into oxygen.","F","Lines 36–40: the species used are not able to do this, so the air is hardly better."],
["Diana Santiago thinks the plants will make people drive less.","F","Lines 40–46: she says the plants encourage more people to drive."],
["The mayor of Mexico City designed the scheme himself.","N","Not in the text – nobody is named as the designer."],
["Supporters claim that the plants absorb noise and heat.","T","Lines 47–50."],
["Other cities have already finished similar projects.","F","Lines 20–22: other cities are only ‘about to start’ similar projects."]];
const SORT2=[
["Plants grow in material made from recycled plastic bottles.","pro"],["Sensors make sure that no water is wasted.","pro"],["The plants increase biodiversity in the city.","pro"],["They absorb noise and heat from the traffic.","pro"],["Motorists feel less stressed.","pro"],
["The costs are sky-high.","con"],["The air quality is only slightly better.","con"],["The scheme may encourage even more people to drive.","con"],["The plants cannot convert carbon into oxygen.","con"]];

const SORT4=[
["A great advantage is …","pro"],["The good thing about … is …","pro"],["The main benefit is …","pro"],
["One serious problem is …","con"],["The biggest disadvantage is …","con"],["One argument against … is …","con"],
["Moreover, …","str"],["On the one hand, … On the other hand, …","str"],["In summary, …","str"],["However, …","str"]];

"Smart homes are becoming more popular, but are they really a good idea?",
"One big advantage is that you can control the lights and the heating with your phone, so you can save energy.",
"Moreover, family members who are away can check that the doors are locked.",
"On the other hand, smart devices are expensive, and not everybody can afford them.",
"Another problem is that they need electricity all the time and can be hacked.",

["Look at those black clouds! It ___ any minute.",["will rain","is going to rain","rains"],1,"There are signs now (the clouds), so we use going to."],
["I hope the plants ___ well this summer.",["will grow","are growing","grows"],0,"After I hope / I think / I’m sure we use will."],
["– I’ve got no pen. – Don’t worry, I ___ you one.",["am lending","will lend","lend"],1,"A spontaneous decision needs will."],
["We ___ our new school garden on Saturday. The tools are ready.",["will start","start","are starting"],[2,0],"A fixed arrangement with preparations made: present progressive. (Will start is accepted here, too.)"],
["If it ___ tomorrow, we will stay at home.",["will rain","rains","is raining"],1,"In an if-clause (type 1) we use the simple present, not will."]];
const DLG=[
["Mia: Have you decided what to do on Eco Day?",null],
["Tom: Yes, we ","(1) plant",["are going to plant","are planting"]," trees behind the gym. Our teacher has already ordered them."],
["Mia: Great! What time ","(2) it / start",["does it start","will it start"],"?"],
["Tom: At nine. I hope it ","(3) not / rain",["will not rain"],"."],
["Mia: If it rains, we ","(4) move",["will move"]," everything into the hall."],
["Tom: Good idea. Oh, my phone is ringing again – wait, I ","(5) answer",["will answer"]," it, you carry on."],
["Mia: Look at those clouds! It ","(6) rain",["is going to rain"]," any minute."],
["Tom: Then we ","(7) have",["will have"]," to hurry."]];
const TALK=["Will vertical gardens make our cities healthier?","Will people still own their own cars in 2050? Why (not)?","Will drones deliver most of our parcels in the future?","Will ‘smart’ homes help us to use less energy?","What are you going to do this week to protect the planet?","Are you going to travel by plane next summer? Why (not)?","Will cities have more green spaces in twenty years?","Are you going to buy a second-hand phone next time? Why (not)?","Will we all eat less meat in the future?","Is your school going to do something for the environment this year?"];
const TOPICS={a:["Delivery drones","Drones bring parcels to your door."],b:["E-scooters in our town","People can rent e-scooters with an app."],c:["A green roof on our school","Plants and solar panels on top of the school building."]};


/* ---------- artwork ---------- */
function turbine(x,y,k,dur){return `<g transform="translate(${x},${y}) scale(${k})"><path d="M-2.5 0 L2.5 0 L1.2 -86 L-1.2 -86Z" fill="#fff"/><g transform="translate(0,-86)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${dur}s" repeatCount="indefinite"/><path d="M0 0 L-3.5 -44 L3.5 -44Z" fill="#fff"/><path d="M0 0 L-3.5 -44 L3.5 -44Z" fill="#fff" transform="rotate(120)"/><path d="M0 0 L-3.5 -44 L3.5 -44Z" fill="#fff" transform="rotate(240)"/></g><circle r="5" fill="#E9F5EC" stroke="#9CCBB0" stroke-width="1.5"/></g></g>`}
function tree(x,y,k,c1,c2,cls){return `<g transform="translate(${x},${y}) scale(${k})"><g class="sway ${cls||""}"><rect x="-3" y="-34" width="6" height="34" rx="3" fill="#7A5A3A"/><ellipse cx="0" cy="-48" rx="22" ry="24" fill="${c1}"/><ellipse cx="-12" cy="-40" rx="14" ry="15" fill="${c2}"/><ellipse cx="13" cy="-42" rx="13" ry="14" fill="${c2}"/></g></g>`}
function bush(x,y,k,c){return `<g transform="translate(${x},${y}) scale(${k})"><g class="sway s2"><ellipse cx="0" cy="-9" rx="16" ry="11" fill="${c}"/><ellipse cx="-11" cy="-5" rx="9" ry="7" fill="#58B368"/><ellipse cx="11" cy="-5" rx="9" ry="7" fill="#58B368"/></g></g>`}

function b64bytes(u){const b=atob(u.split(",")[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function buildPdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const add=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,body)=>{off[n]=len;add(n+" 0 obj\n");add(body);add("\nendobj\n")};
  add("%PDF-1.4\n");
  const N=pages.length;obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Count "+N+" /Kids ["+pages.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"] >>");
  pages.forEach((c,i)=>{const b=3+i*3,jpg=b64bytes(c.toDataURL("image/jpeg",.9));
    obj(b,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+(b+2)+" 0 R >> >> /Contents "+(b+1)+" 0 R >>");
    const cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";obj(b+1,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
    off[b+2]=len;add((b+2)+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+c.width+" /Height "+c.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);add("\nendstream\nendobj\n")});
  const total=3+N*3,xr=len;let t="xref\n0 "+total+"\n0000000000 65535 f \n";for(let i=1;i<total;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
