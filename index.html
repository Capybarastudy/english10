<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English 10 – Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#0E3B4F;--bg2:#08283A;--fg:#F2F7F7;--muted:#A8C6CC;--card:#FBFAF6;--ink:#14262E;--coral:#F0745A;--sun:#FFC845;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1C6B80 0%,var(--bg) 45%,var(--bg2) 100%) fixed var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sun);font-weight:700}
h1{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:clamp(40px,8vw,68px);line-height:1;margin:8px 0 12px}
p{color:var(--muted);max-width:60ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.game{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border-radius:14px;padding:20px;border:3px solid transparent;transition:transform .15s,border-color .15s}
a.game:hover,a.game:focus-visible{transform:translateY(-3px);border-color:var(--coral);outline:none}
a.game .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#B84C36;font-weight:700}
a.game h2{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:30px;margin:0;line-height:1.05}
a.game span.meta{font-size:15px;color:#4E6268}
a.game .go{margin-top:6px;align-self:flex-start;background:var(--coral);color:#fff;font-weight:700;border-radius:8px;padding:8px 14px}
</style>
</head>
<body>
<main>
<div class="eyebrow">English · Year 10</div>
<h1>Escape Games</h1>
<p>Choose your game. Work with a partner and keep your book open.</p>
<div class="grid">
<a class="game" href="mandela-last-ferry/">
<span class="tag">Unit 1 · Text 2 · pp. 23–25</span>
<h2>The Last Ferry</h2>
<span class="meta">Nelson Mandela – the troublemaker. Six locks, one door code, 40 minutes on Robben Island.</span>
<span class="go">Start →</span>
</a>
</div>
</main>
</body>
</html>
