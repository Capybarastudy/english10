<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Ferry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one prison-file column; sticky header carries timer, padlocks and the door-code fragments. Limestone light / night-cell dark. */
:root{
  --bg:#0E3B4F; --bg2:#08283A; --on-bg:#F2F7F7; --on-bg-muted:#A8C6CC;
  --surface:#FBFAF6; --surface-2:#E3ECEA; --ink:#14262E; --muted:#4E6268; --line:#C3D1D0;
  --sea:#0F8B8D; --sea-ink:#FFFFFF; --coral:#F0745A; --coral-ink:#FFFFFF; --sun:#FFC845;
  --key:#D9860F; --key-soft:#FFF0CC; --stamp:#D9453A; --stamp-soft:#FBDCD7; --ok:#24965E; --ok-soft:#D4F0E0;
  --wall:#D8D2C4; --floor:#8C8576; --brick:#BDB5A3; --sky:#9FD8E6; --water:#1B8EA1; --mtn:#5E7A70;
  --f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%;background:radial-gradient(ellipse at 50% -10%,#1C6B80 0%,var(--bg) 45%,var(--bg2) 100%) fixed var(--bg);color:var(--on-bg);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:3px solid var(--coral);color:var(--on-bg)}
.top-in{max-width:980px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;line-height:1;margin-right:auto}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-bg-muted);margin-top:3px}
.locks{display:flex;gap:4px}
.locks svg{width:22px;height:26px}
.frag{display:flex;gap:4px;align-items:center}
.frag span{width:26px;height:32px;border:2px solid var(--sun);border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:18px;color:var(--sun)}
.frag span.got{background:var(--sun);color:var(--ink);box-shadow:0 0 12px rgba(255,200,69,.6)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.12)}
.timer.late{background:var(--stamp);color:var(--surface)}
.timer svg{width:22px;height:22px}
.tbtn{border:1.5px solid rgba(255,255,255,.3);background:transparent;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--on-bg-muted)}

main{max-width:980px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sun);font-weight:700}
.paper .eyebrow,.modal .eyebrow,.lock .eyebrow,.door .eyebrow{color:var(--key)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7vw,64px);line-height:1;margin:6px 0 14px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.5vw,40px);line-height:1.05;margin:4px 0 10px;text-wrap:balance}
h3{font-size:18px;margin:0 0 8px}
p{margin:0 0 12px;max-width:68ch}
.paper,.lock,.rules div,.stats div,.q,.board,.modal,.bubble,.hint,.sent li,.steps li,.card,.dial div,.opt,.read,textarea,input,.btn,.door{color:var(--ink)}
.story{font-size:18px}
.paper{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.read{display:flex;gap:12px;align-items:center;background:var(--key-soft);border-left:6px solid var(--key);border-radius:6px;padding:12px 14px;font-weight:700}
.read svg{flex:none;width:28px;height:28px;color:var(--key)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.rules div{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:15px}
.rules b{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:2px}
.note{font-family:var(--f-mono);font-size:15px;background:var(--surface);border:1.5px dashed var(--ink);padding:16px 18px;border-radius:4px;max-width:60ch;transform:rotate(-.6deg)}

.btn{border:2px solid var(--ink);background:var(--surface);border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--coral-ink);box-shadow:0 4px 0 #B84C36}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #B84C36}
.btn.ghost{border-color:var(--line);font-weight:400;background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input.field{border:2px solid var(--ink);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:48px}

/* lock */
.lock{background:var(--surface-2);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lock label{font-weight:700}
.code{font-family:var(--f-mono);font-weight:600;font-size:26px;letter-spacing:.25em;text-transform:uppercase;width:min(100%,300px);text-align:center}
.fb{min-height:1.5em;margin:0;font-weight:700}
.fb.bad{color:var(--stamp)} .fb.good{color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* hints */
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--surface);border:2px solid var(--sun);border-radius:12px;padding:10px 14px;font-size:16px}
.hint b{color:var(--sea)}

/* room 1 table */
.tfn{width:100%;border-collapse:collapse;font-size:16px}
.tfn th,.tfn td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.tfn th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tfn td.c{width:68px;text-align:center}
.cell{width:52px;height:44px;border:2px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:18px;cursor:pointer}
.cell.on{border-color:var(--sea);background:var(--sea);color:var(--sea-ink)}
.scroll{overflow-x:auto}

/* room 2 cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;min-height:96px;position:relative}
.card .n{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:20px}
.card.used{opacity:.45;border-style:dashed}
.card .ord{position:absolute;right:8px;top:6px;font-size:12px;font-weight:700;color:var(--sea)}

/* room 3 steps */
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px}
.steps li.start::before{content:"0"}
.steps li div{min-width:0}

/* room 4 board */
.board{background:var(--surface);border:3px solid var(--ink);border-radius:4px;padding:20px 22px}
.board-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px;font-family:var(--f-display);font-size:20px;letter-spacing:.03em}
.board p{line-height:2.4;max-width:none}
.gap{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.gap input{border:none;border-bottom:2px solid var(--ink);background:transparent;width:10.5em;padding:0 4px;font-size:17px;line-height:1.3;border-radius:0}
.gap input.ok{border-bottom-color:var(--ok);color:var(--ok);font-weight:700}
.gap input.no{border-bottom-color:var(--stamp);background:var(--stamp-soft)}
.gap .pos{font-family:var(--f-mono);font-size:13px;color:var(--key);font-weight:600}
.gap .src{font-size:14px;color:var(--muted)}
.reveal{display:flex;gap:6px;flex-wrap:wrap}
.reveal span{width:42px;height:50px;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:28px}
.reveal span.got{border-color:var(--ok);color:var(--ok)}

/* room 5 dial */
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dial div{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px}
.dial i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--key);color:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.sent{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.sent li{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.blank{display:inline-block;width:7.5em;border-bottom:2px solid var(--ink);margin:0 4px}

/* room 6 */
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px}
.q .ask{font-style:italic;font-size:18px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;cursor:pointer}
.opt b{flex:none;width:30px;height:30px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center}
.opt.on{border-color:var(--sea)}
.opt.on b{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.door{border:3px solid var(--ink);border-radius:6px;padding:20px;background:repeating-linear-gradient(90deg,var(--surface) 0 46px,var(--surface-2) 46px 52px)}
.door .in{background:var(--surface);border-radius:8px;padding:16px;max-width:460px}

/* modal */
.veil{position:fixed;inset:0;background:rgba(10,16,18,.6);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:2px solid var(--ink);border-radius:12px;max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto}
.big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--key)}
.sol{font-family:var(--f-mono);font-size:14px;background:var(--surface-2);border-radius:6px;padding:10px;white-space:pre-wrap}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* end */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats div{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px}
.stats b{display:block;font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
textarea{width:100%;min-height:120px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);padding:10px;line-height:1.6}
.bonus{display:flex;flex-direction:column;gap:10px}
.bonus .row input{width:90px}
.ok-t{color:var(--ok);font-weight:700}

/* map */
.maphead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.maphead p{margin:0;color:var(--on-bg-muted)}
.mapwrap{border-radius:18px;overflow:hidden;border:3px solid #0A2230;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.mapwrap svg{display:block;width:100%;height:auto}
.lbl{font-family:var(--f-body);font-weight:700;font-size:21px;fill:#FFFFFF;stroke:#0A2A3A;stroke-width:6px;paint-order:stroke;stroke-linejoin:round}
.lbl.small{font-size:14px;stroke-width:4px;fill:#F4F1E8}
.node{cursor:default}
.node.cur,.node.done{cursor:pointer}
.node:focus{outline:none}.node:focus-visible .ring{stroke:var(--sun)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.75);opacity:.75}to{transform:scale(1.45);opacity:0}}
.popin{transform-box:fill-box;transform-origin:center;animation:popin .7s cubic-bezier(.3,1.6,.5,1) 1.4s both}
@keyframes popin{from{transform:scale(.3)}to{transform:none}}
.seg{fill:none;stroke-linecap:round}
.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.4s ease-in-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.waves path{animation:drift 7s linear infinite}
.waves path:nth-child(2n){animation-duration:11s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.beam{transform-box:view-box;transform-origin:590px 186px;animation:beam 6s linear infinite}
@keyframes beam{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.gull{animation:gull 22s linear infinite}
.gull.g2{animation-duration:30s;animation-delay:-12s}
@keyframes gull{from{transform:translateX(-80px)}to{transform:translateX(1080px)}}
.gull path{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(.4)}}
.peng{transform-box:fill-box;transform-origin:50% 100%;animation:waddle .5s ease-in-out infinite alternate}
@keyframes waddle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.bobf{animation:bobf 2.6s ease-in-out infinite alternate}
@keyframes bobf{from{transform:translateY(-3px) rotate(-1deg)}to{transform:translateY(3px) rotate(1deg)}}
#mapGuide{transition:transform 1.8s cubic-bezier(.45,0,.4,1)}
#mapGuide:not(.walking) .legL,#mapGuide:not(.walking) .legR,#mapGuide:not(.walking) .armL,#mapGuide:not(.walking) .armR,#mapGuide:not(.walking) .bob{animation:none}
#mapGuide.walking .legL,#mapGuide.walking .legR,#mapGuide.walking .armL,#mapGuide.walking .armR,#mapGuide.walking .bob{animation-iteration-count:infinite}
.backmap{align-self:flex-start}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.flash{animation:flash .5s}
@keyframes flash{30%{box-shadow:inset 0 0 0 9999px rgba(217,69,58,.25)}}
@media (prefers-reduced-motion:reduce){.pulse,.popin,.draw,.waves path,.beam,.gull,.gull path,.peng,.bobf,.flash{animation:none!important;stroke-dashoffset:0}#mapGuide{transition:none}}

/* scene + guide */
.scene{position:relative;display:flex;align-items:flex-end;gap:14px;min-height:250px;padding:18px 18px 0;border-radius:12px;overflow:hidden;border:2px solid var(--ink);
  background:linear-gradient(var(--wall),var(--wall)) top/100% 78% no-repeat,linear-gradient(var(--floor),var(--floor)) bottom/100% 22% no-repeat}
.scene::before{content:"";position:absolute;inset:0 0 22% 0;background-image:linear-gradient(var(--brick) 2px,transparent 2px),linear-gradient(90deg,var(--brick) 2px,transparent 2px);background-size:84px 34px;opacity:.55;pointer-events:none}
.scene .bars{position:absolute;right:0;top:0;bottom:22%;width:118px;opacity:.9}
.walker{position:relative;z-index:1;flex:none;width:118px;animation:walkIn 2.1s cubic-bezier(.3,.6,.4,1) both}
.walker svg{display:block;width:100%;height:auto}
.legL,.legR,.armL,.armR{transform-box:view-box}
.legL{transform-origin:56px 146px;animation:swing .42s ease-in-out 5 alternate}
.legR{transform-origin:64px 146px;animation:swing .42s ease-in-out 5 alternate-reverse}
.armL{transform-origin:42px 88px;animation:swing .42s ease-in-out 5 alternate-reverse}
.armR{transform-origin:80px 88px;animation:swing .42s ease-in-out 5 alternate}
.wave .armR{animation:wave .6s ease-in-out 2.2s 6 alternate}
.bob{animation:bob .42s ease-in-out 5 alternate}
@keyframes walkIn{from{transform:translateX(-150%)}to{transform:none}}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-110deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.bubble{position:relative;z-index:2;align-self:center;margin-bottom:40px;background:var(--surface);border:2.5px solid var(--ink);border-radius:16px;padding:14px 16px;font-size:17px;max-width:min(560px,100%);min-width:0;flex:1;animation:pop .45s 1.9s both}
.bubble::before{content:"";position:absolute;left:-14px;bottom:26px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;bottom:28px;border:10px solid transparent;border-right-color:var(--surface);border-left:0}
.bubble .who{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);font-weight:700;margin-bottom:2px}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
@keyframes pop{from{opacity:0;transform:scale(.85) translateX(-10px)}to{opacity:1;transform:none}}
.still .walker,.still .bubble,.still .legL,.still .legR,.still .armL,.still .armR,.still .bob{animation:none}
.still .wave .armR{animation:none;transform:rotate(-130deg)}
.hint{display:flex;gap:10px;align-items:flex-start;border-style:solid}
.hint svg{flex:none;width:46px;height:46px}
/* doors */
.doorbox{display:grid;place-items:center;margin:4px 0 10px}
.doorbox svg{width:min(240px,70vw);height:auto}
.slide{animation:slide 1.3s cubic-bezier(.6,0,.3,1) .5s both}
.slideL{animation:slideL 1.6s cubic-bezier(.6,0,.3,1) .6s both}
.slideR{animation:slideR 1.6s cubic-bezier(.6,0,.3,1) .6s both}
@keyframes slide{to{transform:translateX(172px)}}
@keyframes slideL{to{transform:translateX(-112px)}}
@keyframes slideR{to{transform:translateX(112px)}}
.glow{animation:glow 1.2s 1.4s both}
@keyframes glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.tag{transform-box:fill-box;transform-origin:center}
.ferry{animation:sail 3s ease-out both}
.ferry.away{animation:sailAway 5s ease-in both}
@keyframes sail{from{transform:translateX(120%)}to{transform:none}}
@keyframes sailAway{from{transform:none}to{transform:translateX(160%)}}
.harbour{position:relative;min-height:230px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(var(--sky),var(--sky)) top/100% 60% no-repeat,linear-gradient(var(--water),var(--water)) bottom/100% 40% no-repeat;display:flex;align-items:flex-end;gap:14px;padding:18px 18px 0}
.harbour .boat{position:absolute;right:4%;bottom:26%;width:min(260px,45%)}
.harbour .mtn{position:absolute;right:0;left:0;bottom:40%;height:70px;width:100%}
@media (max-width:560px){.walker{width:84px}.scene,.harbour{padding:12px 10px 0;gap:8px}.bubble{font-size:15px;margin-bottom:30px;padding:10px 12px}.scene .bars{width:70px}}
@media (prefers-reduced-motion:reduce){.shake,.walker,.bubble,.legL,.legR,.armL,.armR,.bob,.slide,.slideL,.slideR,.glow,.ferry,.wave .armR{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
@media (max-width:560px){.frag span{width:22px;height:28px;font-size:15px}.locks svg{width:18px;height:22px}.brand{font-size:19px}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">THE LAST FERRY<small>Robben Island · Cell Block B</small></div>
  <div class="locks" id="locks" aria-label="Locks opened"></div>
  <div class="frag" id="frag" aria-label="Door code fragments"></div>
  <div class="timer" id="timer" aria-live="off"></div>
  <button class="tbtn" data-act="teacher" type="button">Teacher</button>
</div></header>

<main id="app"></main>

}
setInterval(tick,1000);

/* ---------- ACTIONS ---------- */
function modal(html){$("#modal").innerHTML=html;$("#veil").hidden=false;const f=$("#modal").querySelector("input,button");if(f)f.focus()}
function closeModal(){$("#veil").hidden=true}
function wrongCode(n,msg){
  S.wrong++;S.penalty+=30;S.streak[n]=(S.streak[n]||0)+1;document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash");
  const f=$("#fb"+n), inp=$("#code"+n);
  if(S.streak[n]>=3){S.streak[n]=0;S.cool[n]=Date.now()+20000;if(inp)inp.disabled=true;const b=document.querySelector(`[data-act="unlock"][data-n="${n}"]`);if(b)b.disabled=true;msg="Three wrong codes – the guard blocks the keypad for 20 seconds. (−30 s)"}
  if(f){f.textContent=msg||"Wrong code. The lock stays shut. (−30 s)";f.className="fb bad"}
  const el=inp||f;if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
  save();tick();
}
function solve(n){
  S.streak[n]=0;if(!S.solved.includes(n))S.solved.push(n);save();head();
  modal(`<div class="eyebrow">Lock ${n} opened</div><h2>Click!</h2><div class="doorbox">${cellDoor(DIGITS[n-1])}</div><p>Behind the bars hangs a metal tag with the number <b>${DIGITS[n-1]}</b>. Keep it – it's part of the door code.</p><div class="row"><button class="btn primary" type="button" data-act="next">Back to the island map</button></div>`);confetti();
}
function finish(){
  S.end=Date.now();S.screen="end";if(!S.solved.includes(6))S.solved.push(6);save();setTimeout(confetti,300);
  modal(`<div class="eyebrow">The door opens</div><h2>4 6 6 6 4</h2><div class="doorbox">${gate()}</div><p>You have just typed Nelson Mandela's prison number from Robben Island (line 135). In 2003 he used this number as the name of a charity: international pop concerts raised money for people with AIDS. A number meant to take away his name became a symbol of hope.</p><div class="row"><button class="btn primary" type="button" data-act="close">Run to the harbour</button></div>`);
  render();
}
function check(n){
  const inp=$("#code"+n);const v=norm(inp&&inp.value);
  if(!v){const f=$("#fb"+n);f.textContent="Type a code first.";f.className="fb bad";return}
  const ans={1:D.r1,2:D.r2,3:D.r3,4:D.r4.map((w,k)=>w[0][D.r4pos[k]-1]).join(""),5:D.r5,7:D.door}[n];
  if(v===ans){if(n===7)finish();else solve(n)}
  else wrongCode(n, n===2&&v.length!==6?"The code has 6 digits. (−30 s)":null);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,n=+b.dataset.n,i=+b.dataset.i;
  if(a==="start"){const t=$("#team").value.trim();if(!t){$("#fb0").textContent="Please enter a team name.";$("#fb0").className="fb bad";return}S.team=t;if(!S.start)S.start=Date.now();S.screen="map";save();render()}
  else if(a==="unlock")check(n);
  else if(a==="next"){closeModal();MOVE={to:S.screen+1};S.screen="map";save();render()}
  else if(a==="map"){S.screen="map";save();render()}
  else if(a==="room"){S.screen=n;save();render()}
  else if(a==="close"){closeModal()}
  else if(a==="hint"){const h=S.hints[n]||0;S.hints[n]=h+1;S.penalty+=h===0?60:120;save();render()}
  else if(a==="r1"){S.r1[i]=+b.dataset.k;save();b.closest("tr").querySelectorAll(".cell").forEach(c=>c.classList.toggle("on",c===b))}
  else if(a==="r2"){if(S.r2.includes(i)){S.r2=S.r2.filter(x=>x!==i)}else if(S.r2.length<6){S.r2.push(i)}save();const v=S.r2.map(x=>CARDS[x][0]).join("");render();$("#code2").value=v}
  else if(a==="r2undo"){S.r2.pop();save();const v=S.r2.map(x=>CARDS[x][0]).join("");render();$("#code2").value=v}
  else if(a==="r2clear"){S.r2=[];save();render()}
  else if(a==="r4check"){
    let bad=0;BOARD.forEach((x,k)=>{const el=$("#g"+k);S.r4[k]=el.value;if(S.r4ok.includes(k))return;if(D.r4[k].includes(norm(el.value))){S.r4ok.push(k)}else bad++});
    if(bad){S.wrong++;S.penalty+=30}
    save();render();
    const f=$("#fb4w");
    if(!bad){f.textContent="All six words are correct. Now find the password!";f.className="fb good"}
    else{BOARD.forEach((x,k)=>{if(!S.r4ok.includes(k))$("#g"+k).classList.add("no")});f.textContent=`${bad} word${bad>1?"s are":" is"} still wrong. (−30 s)`;f.className="fb bad"}
  }
  else if(a==="r6"){S.r6[i]=b.dataset.o;save();b.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o===b))}
  else if(a==="r6check"){
    const f=$("#fb6");
    if(Object.keys(S.r6).length<3){f.textContent="Answer all three questions first.";f.className="fb bad";return}
    const right=D.r6.filter((x,k)=>S.r6[k]===x).length;
    if(right===3){S.r6ok=true;save();render();const c=$("#code7");if(c)c.scrollIntoView({behavior:"smooth",block:"center"})}
    else{S.wrong++;S.penalty+=30;save();tick();f.textContent=`She frowns. ${right} of 3 answers are good – but she won't tell you which. (−30 s)`;f.className="fb bad"}
  }
  else if(a==="bonus"){const el=$("#b"+i);S.bonus[i]=el.value;const ok=D.bonus[i].includes(norm(el.value));const f=$("#bf"+i);if(ok){S.bonusOk.push(i);el.readOnly=true;b.disabled=true;f.textContent="Correct!";f.className="ok-t"}else{f.textContent="Not this line.";f.className=""}save()}
  else if(a==="teacher")teacherOpen();
  else if(a==="tlogin"){if(norm($("#tcode").value)===D.teacher){teacher=true;teacherOpen()}else{$("#tfb").textContent="Wrong teacher code.";$("#tfb").className="fb bad"}}
  else if(a==="tskip"){closeModal();const r=S.screen;if(typeof r==="number"){if(r===6){if(!S.start)S.start=Date.now();finish()}else{if(!S.solved.includes(r))S.solved.push(r);MOVE={to:r+1};S.screen="map";save();render()}}}
  else if(a==="tgo"){closeModal();if(!S.start)S.start=Date.now();S.end=0;S.screen=n;S.solved=[];for(let k=1;k<n;k++)S.solved.push(k);save();render()}
  else if(a==="tadd"){S.added+=300;save();tick();teacherOpen()}
  else if(a==="treset"){$("#tconfirm").hidden=false}
  else if(a==="treset2"){S=fresh();save();closeModal();render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="ticket"){S.ticket=e.target.value;save()}
  else if(/^g\d$/.test(e.target.id)){S.r4[+e.target.id.slice(1)]=e.target.value;e.target.classList.remove("no");save()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#veil").hidden){closeModal();return}
  if(e.key!=="Enter"&&e.key!==" ")return;if(e.target.classList&&e.target.classList.contains("node")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}if(e.key!=="Enter")return;const id=e.target.id||"";
  if(/^code\d$/.test(id))check(+id.slice(4));
  else if(id==="team")$('[data-act="start"]').click();
  else if(id==="tcode")$('[data-act="tlogin"]').click();
});
$("#veil").addEventListener("click",e=>{if(e.target.id==="veil"&&teacher)closeModal()});

function teacherOpen(){
  if(!teacher){modal(`<div class="eyebrow">Teacher mode</div><h2>Teacher code</h2><div class="row"><input class="field" id="tcode" autocomplete="off" autocapitalize="characters"><button class="btn primary" type="button" data-act="tlogin">Enter</button></div><p class="fb" id="tfb"></p><div class="row"><button class="btn ghost" type="button" data-act="close">Back to the game</button></div>`);return}
  const r=S.screen;const sol=typeof r==="number"?D.sol[r]:"";
  let go="";for(let k=1;k<=6;k++)go+=`<button class="btn ghost" type="button" data-act="tgo" data-n="${k}">Lock ${k}</button>`;
  modal(`<div class="eyebrow">Teacher mode</div><h2>Control panel</h2>
  ${sol?`<h3>Solution – lock ${r}</h3><div class="sol">${esc(sol)}</div>`:"<p>Open a lock to see its solution here.</p>"}
  <div class="row" style="margin:12px 0">${typeof r==="number"?`<button class="btn primary" type="button" data-act="tskip">Skip this lock</button>`:""}<button class="btn" type="button" data-act="tadd">+5 minutes</button></div>
  <h3>Jump to a lock</h3><div class="tgrid">${go}</div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" type="button" data-act="treset">Reset game</button><button class="btn ghost" type="button" data-act="close">Close</button></div>
  <div id="tconfirm" hidden><p class="fb bad">This deletes all progress on this device.</p><button class="btn" type="button" data-act="treset2">Yes, reset</button></div>`);
}
render();
</script>

</body>
</html>
